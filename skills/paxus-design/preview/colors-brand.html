<!doctype html>
<!-- @dsCard group="Colors" name="Colors — Brand" subtitle="Burgundy, mauve, blush, cream" viewport="700x260" -->
<html><head><meta charset="utf-8"><title>Brand colors</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px 24px; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  .sw { border-radius:14px; overflow:hidden; box-shadow: var(--ring-2); }
  .chip { height:64px; }
  .label { padding:10px 12px; background:var(--bg-surface); }
  .name { font-size:13px; font-weight:700; color:var(--fg-1); }
  .hex { font-size:11px; color:var(--fg-3); font-family:var(--font-mono); margin-top:2px; }
</style></head>
<body>
<div class="grid">
  <div class="sw"><div class="chip" style="background:#682145"></div><div class="label"><div class="name">Burgundy</div><div class="hex">#682145</div></div></div>
  <div class="sw"><div class="chip" style="background:#491730"></div><div class="label"><div class="name">Burgundy deep</div><div class="hex">#491730</div></div></div>
  <div class="sw"><div class="chip" style="background:#2A0A1A"></div><div class="label"><div class="name">Burgundy ink</div><div class="hex">#2A0A1A</div></div></div>
  <div class="sw"><div class="chip" style="background:#C084A4"></div><div class="label"><div class="name">Mauve</div><div class="hex">#C084A4</div></div></div>
  <div class="sw"><div class="chip" style="background:#C9A8BC"></div><div class="label"><div class="name">Mauve soft</div><div class="hex">#C9A8BC</div></div></div>
  <div class="sw"><div class="chip" style="background:#ECD2E1"></div><div class="label"><div class="name">Blush</div><div class="hex">#ECD2E1</div></div></div>
  <div class="sw"><div class="chip" style="background:#F7EDF3"></div><div class="label"><div class="name">Blush soft</div><div class="hex">#F7EDF3</div></div></div>
  <div class="sw"><div class="chip" style="background:#FBF7F4"></div><div class="label"><div class="name">Cream</div><div class="hex">#FBF7F4</div></div></div>
</div>
</body></html>
