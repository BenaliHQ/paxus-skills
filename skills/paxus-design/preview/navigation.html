<!doctype html>
<!-- @dsCard group="Components" name="Navigation header" subtitle="Sticky blur header" viewport="700x140" -->
<html><head><meta charset="utf-8"><title>Navigation</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:0; background:#FBF7F4; }
  .nav { display:flex; align-items:center; justify-content:space-between; padding:14px 28px; background:rgba(251,247,244,0.85); backdrop-filter:blur(12px); box-shadow:0 1px 0 rgba(26,18,23,0.06); }
  .left { display:flex; align-items:center; gap:32px; }
  .logo { font-family:var(--font-display); font-weight:500; font-size:22px; letter-spacing:0.16em; color:#681E44; }
  .links { display:flex; gap:4px; }
  .links a { padding:8px 14px; border-radius:9999px; font-size:14px; font-weight:600; color:#1A1217; text-decoration:none; transition:background var(--dur-base) var(--ease-out); }
  .links a:hover { background:#F2E8EE; }
  .links a.active { background:#F2E8EE; color:#681E44; }
  .right { display:flex; gap:8px; align-items:center; }
  .btn { font-size:14px; font-weight:600; border:0; cursor:pointer; padding:9px 18px; border-radius:9999px; transition:transform var(--dur-base) var(--ease-spring); }
  .btn:hover { transform:scale(1.03); }
  .ghost { background:transparent; color:#1A1217; }
  .primary { background:#681E44; color:#FBF7F4; }
  .pad { padding: 28px; color:var(--fg-3); font-size:12px; }
</style></head>
<body>
  <nav class="nav">
    <div class="left">
      <div class="logo">PAXUS</div>
      <div class="links">
        <a class="active">Services</a>
        <a>Pricing</a>
        <a>About</a>
        <a>Resources</a>
      </div>
    </div>
    <div class="right">
      <button class="btn ghost">Sign in</button>
      <button class="btn primary">Book a call</button>
    </div>
  </nav>
  <div class="pad">Sticky header · 64px tall · blur 12px · cream rgba 0.85</div>
</body></html>
