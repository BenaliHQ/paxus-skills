<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing" subtitle="4px base scale" viewport="700x300" -->
<html><head><meta charset="utf-8"><title>Spacing</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px 28px; }
  .row { display:grid; grid-template-columns:80px 60px 1fr; gap:20px; align-items:center; padding:6px 0; }
  .name { font-size:13px; font-weight:700; }
  .px { font-size:12px; color:var(--fg-3); font-family:var(--font-mono); }
  .bar { height:14px; background:var(--paxus-burgundy); border-radius:4px; }
</style></head>
<body>
  <div class="row"><div class="name">space-1</div><div class="px">4px</div><div class="bar" style="width:4px"></div></div>
  <div class="row"><div class="name">space-2</div><div class="px">8px</div><div class="bar" style="width:8px"></div></div>
  <div class="row"><div class="name">space-3</div><div class="px">12px</div><div class="bar" style="width:12px"></div></div>
  <div class="row"><div class="name">space-4</div><div class="px">16px</div><div class="bar" style="width:16px"></div></div>
  <div class="row"><div class="name">space-6</div><div class="px">24px</div><div class="bar" style="width:24px"></div></div>
  <div class="row"><div class="name">space-8</div><div class="px">32px</div><div class="bar" style="width:32px"></div></div>
  <div class="row"><div class="name">space-12</div><div class="px">48px</div><div class="bar" style="width:48px"></div></div>
  <div class="row"><div class="name">space-16</div><div class="px">64px</div><div class="bar" style="width:64px"></div></div>
  <div class="row"><div class="name">space-24</div><div class="px">96px</div><div class="bar" style="width:96px"></div></div>
</body></html>
