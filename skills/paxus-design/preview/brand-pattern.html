<!doctype html>
<!-- @dsCard group="Brand" name="Brand motif" subtitle="Rosette as background watermark" viewport="700x240" -->
<html><head><meta charset="utf-8"><title>Brand pattern</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:0; }
  .hero { position:relative; background:#681E44; color:#FBF7F4; padding:36px 32px; min-height:220px; overflow:hidden; }
  .hero .deco { position:absolute; right:24px; top:50%; transform:translateY(-50%); opacity:0.06; pointer-events:none; }
  .hero .deco img { width:160px; display:block; }
  .eyebrow { font-family:var(--font-ui); font-size:11px; font-weight:700; letter-spacing:0.16em; text-transform:uppercase; color:#E0D0E0; margin-bottom:14px; }
  .hh { font-family:var(--font-display); font-weight:800; font-size:44px; line-height:0.95; letter-spacing:-0.025em; max-width:520px; }
  .sub { font-family:var(--font-body); font-size:14px; color:#E0D0E0; margin-top:10px; max-width:420px; line-height:1.55; }
</style></head>
<body>
  <div class="hero">
    <div class="deco"><img src="../assets/paxus-mark-cream.png" alt=""></div>
    <div class="eyebrow">Decorative motif</div>
    <div class="hh">The rosette as a quiet background watermark.</div>
    <div class="sub">Use the actual logo mark at ~6% opacity on dark hero blocks — present, not loud. Never overlaid on photography. Never scaled below 120px.</div>
  </div>
</body></html>
