<!doctype html>
<!-- @dsCard group="Components" name="Buttons" subtitle="Pill CTAs, scale-on-hover" viewport="700x140" -->
<html><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px 28px; display:flex; flex-wrap:wrap; gap:14px 16px; align-items:center; }
  .btn { font-family:var(--font-body); font-size:15px; font-weight:600; border:0; cursor:pointer; padding:12px 22px; border-radius:9999px; display:inline-flex; align-items:center; gap:8px; transition:transform var(--dur-base) var(--ease-spring), background var(--dur-base) var(--ease-out); }
  .btn:hover { transform: scale(1.03); }
  .btn:active { transform: scale(0.97); }
  .primary { background:#682145; color:#FBF7F4; }
  .primary:hover { background:#491730; }
  .secondary { background:rgba(104, 33, 69,0.08); color:#1A1217; }
  .secondary:hover { background:rgba(104, 33, 69,0.14); }
  .outline { background:transparent; color:#1A1217; box-shadow: inset 0 0 0 1px rgba(26,18,23,0.18); }
  .outline:hover { box-shadow: inset 0 0 0 1px var(--paxus-burgundy); color:var(--paxus-burgundy); }
  .ghost { background:transparent; color:#682145; }
  .ghost:hover { background:#F7EDF3; }
  .small { padding:6px 14px; font-size:13px; }
  .lg { padding:16px 28px; font-size:17px; }
  .danger { background:#B0202A; color:#fff; }
  .pill-pair { display:flex; gap:8px; }
</style></head>
<body>
  <button class="btn primary lg">Book a call</button>
  <button class="btn primary">Get started</button>
  <button class="btn secondary">See pricing</button>
  <button class="btn outline">Sign in</button>
  <button class="btn ghost">Learn more →</button>
  <button class="btn primary small">Save</button>
  <button class="btn danger small">Delete</button>
</body></html>
