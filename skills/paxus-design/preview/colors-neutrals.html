<!doctype html>
<!-- @dsCard group="Colors" name="Colors — Neutrals" subtitle="Warm mauve-tinted greys" viewport="700x260" -->
<html><head><meta charset="utf-8"><title>Neutrals</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px 24px; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  .sw { border-radius:14px; overflow:hidden; box-shadow: var(--ring-2); }
  .chip { height:64px; }
  .label { padding:10px 12px; background:var(--bg-surface); }
  .name { font-size:13px; font-weight:700; color:var(--fg-1); }
  .hex { font-size:11px; color:var(--fg-3); font-family:var(--font-mono); margin-top:2px; }
</style></head>
<body>
<div class="grid">
  <div class="sw"><div class="chip" style="background:#1A1217"></div><div class="label"><div class="name">Ink</div><div class="hex">#1A1217</div></div></div>
  <div class="sw"><div class="chip" style="background:#2A2126"></div><div class="label"><div class="name">N-900</div><div class="hex">#2A2126</div></div></div>
  <div class="sw"><div class="chip" style="background:#4A4045"></div><div class="label"><div class="name">N-700</div><div class="hex">#4A4045</div></div></div>
  <div class="sw"><div class="chip" style="background:#87797F"></div><div class="label"><div class="name">N-500</div><div class="hex">#87797F</div></div></div>
  <div class="sw"><div class="chip" style="background:#C9BFC4"></div><div class="label"><div class="name">N-300</div><div class="hex">#C9BFC4</div></div></div>
  <div class="sw"><div class="chip" style="background:#E5DDE1"></div><div class="label"><div class="name">N-200</div><div class="hex">#E5DDE1</div></div></div>
  <div class="sw"><div class="chip" style="background:#EFE8EB"></div><div class="label"><div class="name">N-100</div><div class="hex">#EFE8EB</div></div></div>
  <div class="sw"><div class="chip" style="background:#F7F2F4"></div><div class="label"><div class="name">N-50</div><div class="hex">#F7F2F4</div></div></div>
</div>
</body></html>
