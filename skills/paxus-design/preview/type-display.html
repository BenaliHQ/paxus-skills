<!doctype html>

<html><head><meta charset="utf-8"><title>Display type</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px 28px; }
  .row { display:flex; align-items:baseline; gap:18px; padding:8px 0; border-bottom:1px solid var(--border-subtle); }
  .row:last-child { border-bottom:0; }
  .meta { width:160px; flex:none; font-size:12px; color:var(--fg-3); letter-spacing:0.04em; text-transform:uppercase; font-weight:600; }
  .specimen { color: var(--paxus-burgundy); }
  .small-specimen { font-size: 60px; }
</style></head>
<body>
  <div class="row"><div class="meta">Mega · 112/0.88</div><div class="t-display-mega specimen" style="font-size:88px;line-height:0.88">Books that</div></div>
  <div class="row"><div class="meta">Hero · 88/0.92</div><div class="t-display-hero specimen" style="font-size:64px">balance themselves.</div></div>
  <div class="row"><div class="meta">Section · 60/0.95</div><div class="t-display-section specimen" style="font-size:48px">Books that balance.</div></div>
  <div class="row"><div class="meta">Sub · 40/1.0</div><div class="t-display-sub" style="font-size:32px;color:var(--fg-1)">Advisory that advises.</div></div>
</body></html>
